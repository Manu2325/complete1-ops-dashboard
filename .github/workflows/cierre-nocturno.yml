name: Cierre Nocturno Automático de Tareas (10:30 PM)

on:
  schedule:
    # Programado para ejecutarse a las 10:00 PM hora de Colombia (03:00 UTC del día siguiente)
    - cron: '0 3 * * 2-6'
  workflow_dispatch: # Permite probarlo manualmente desde GitHub si se desea

jobs:
  ejecutar-cierre:
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar Reagendamiento en Firebase
        env:
          TZ: 'America/Bogota'
        run: |
          node -e '
          const https = require("https");

          const GCHAT_WEBHOOK = "https://chat.googleapis.com/v1/spaces/AAQAW2t94sc/messages?key=AIzaSyDdI0hCZtE6vySjMm-WEfRq3CPzqKqqsHI&token=2GZ-2ChSl1mMEhgh7uxocoMdZt07sC-3qki7uPKIPNs";
          const FIREBASE_DB_URL = "https://operational-task-manager-default-rtdb.firebaseio.com";

          function request(url, options = {}, data = null) {
              return new Promise((resolve, reject) => {
                  const req = https.request(url, options, res => {
                      let body = "";
                      res.on("data", chunk => body += chunk);
                      res.on("end", () => resolve(body ? JSON.parse(body) : {}));
                  });
                  req.on("error", reject);
                  if (data) req.write(JSON.stringify(data));
                  req.end();
              });
          }

          // Obtiene la fecha operativa exacta de Colombia (si corre de noche o madrugada, calcula el día de la jornada laboral)
          function getTargetOperationalDate() {
              const now = new Date();
              // Obtener hora actual en Bogotá
              const bogotaTimeStr = now.toLocaleString("en-US", { timeZone: "America/Bogota" });
              const bogotaDate = new Date(bogotaTimeStr);

              // Si corre entre la 00:00 y las 06:00 AM (por retraso en servidores UTC), la jornada que cerró corresponde al día anterior
              if (bogotaDate.getHours() < 6) {
                  bogotaDate.setDate(bogotaDate.getDate() - 1);
              }

              const year = bogotaDate.getFullYear();
              const month = String(bogotaDate.getMonth() + 1).padStart(2, "0");
              const day = String(bogotaDate.getDate()).padStart(2, "0");
              return `${year}-${month}-${day}`;
          }

          function getNextBusinessDay(dateStr) {
              let parts = dateStr.split("-");
              let date = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2]));
              let day = date.getUTCDay(); // 0: Dom, 5: Vie, 6: Sáb
              
              if (day === 5) date.setUTCDate(date.getUTCDate() + 3); // Viernes a Lunes
              else if (day === 6) date.setUTCDate(date.getUTCDate() + 2); // Sábado a Lunes
              else date.setUTCDate(date.getUTCDate() + 1);
              
              return date.toISOString().split("T")[0];
          }

          function getPreviousBusinessDay(year, monthIndex, dayOfMonth) {
              let date = new Date(year, monthIndex, dayOfMonth);
              let dayOfWeek = date.getDay();
              if (dayOfWeek === 0) date.setDate(date.getDate() - 2);
              else if (dayOfWeek === 6) date.setDate(date.getDate() - 1);
              return date.toISOString().split("T")[0];
          }

          function isTaskActiveForDate(task, targetDateStr) {
              if (task.excludedDates && task.excludedDates.includes(targetDateStr)) return false;
              const freq = task.frequency || "once";

              if (freq === "once") return task.date === targetDateStr;
              if (freq === "weekly") {
                  const targetDate = new Date(targetDateStr + "T00:00:00");
                  let targetDay = targetDate.getDay();
                  if (targetDay === 0) targetDay = 7;
                  return targetDay === parseInt(task.dayOfWeek);
              }
              if (freq === "monthly") {
                  const targetDate = new Date(targetDateStr + "T00:00:00");
                  const adjustedDateStr = getPreviousBusinessDay(targetDate.getFullYear(), targetDate.getMonth(), parseInt(task.dayOfMonth));
                  return adjustedDateStr === targetDateStr;
              }
              return false;
          }

          async function main() {
              const targetDateStr = getTargetOperationalDate();
              const nextBusinessDay = getNextBusinessDay(targetDateStr);

              console.log(`Procesando jornada operativa: ${targetDateStr}. Moviendo pendientes al siguiente día hábil: ${nextBusinessDay}`);

              const profiles = await request(`${FIREBASE_DB_URL}/profiles.json`);
              if (!profiles) return console.log("No se encontraron perfiles.");

              let resumenAlertas = [];

              for (const userId of Object.keys(profiles)) {
                  const userProfile = profiles[userId];
                  const tasksData = await request(`${FIREBASE_DB_URL}/tasks/${userId}.json`) || {};
                  let userTasks = tasksData.userTasks || (userProfile ? userProfile.tasks || [] : []);
                  let completedTasks = tasksData.completedTasks || {};

                  const tasksForToday = userTasks.filter(t => isTaskActiveForDate(t, targetDateStr));
                  const pending = tasksForToday.filter(t => !completedTasks[`${t.id}_${targetDateStr}`]);

                  if (pending.length > 0) {
                      pending.forEach(task => {
                          const freq = task.frequency || "once";
                          if (freq === "once") {
                              task.date = nextBusinessDay;
                          } else {
                              const carryOverId = `carry_${task.id}_${nextBusinessDay}`;
                              if (!userTasks.some(t => t.id === carryOverId)) {
                                  userTasks.push({
                                      id: carryOverId,
                                      frequency: "once",
                                      date: nextBusinessDay,
                                      title: `📌 [REAGENDADA] ${task.title}`,
                                      sub: task.sub || "Tarea pendiente del día anterior",
                                      urgent: task.urgent
                                  });
                              }
                          }
                      });

                      await request(`${FIREBASE_DB_URL}/tasks/${userId}.json`, { method: "PUT" }, {
                          userTasks: userTasks,
                          completedTasks: completedTasks
                      });

                      let listText = pending.map(t => `• *${t.title}*`).join("\n");
                      resumenAlertas.push(`👤 *${userProfile.name}* (${userProfile.role}):\n${listText}`);
                  }
              }

              if (resumenAlertas.length > 0) {
                  const msg = `🚨 *CIERRE NOCTURNO AUTOMÁTICO* 🚨\n\nJornada Cerrada: *${targetDateStr}*\nReagendadas para: *${nextBusinessDay}* (Siguiente Día Hábil)\n\n*Resumen de Tareas Incompletas Reagendadas:*\n\n${resumenAlertas.join("\n\n")}\n\nLas tareas fueron reprogramadas en la agenda de cada usuario.`;

                  await request(GCHAT_WEBHOOK, {
                      method: "POST",
                      headers: { "Content-Type": "application/json; charset=UTF-8" }
                  }, { text: msg });

                  console.log("Alerta enviada a Google Chat con éxito.");
              } else {
                  console.log("No hay tareas pendientes por reagendar.");
              }
          }

          main().catch(console.error);
          '