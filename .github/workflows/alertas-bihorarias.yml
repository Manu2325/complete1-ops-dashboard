name: Alerta Bi-horaria de Resultados (9:00 AM - 5:00 PM)

on:
  schedule:
    # Minuto 2 para evitar saturación de servidores en el minuto :00
    # 9:00 AM Colombia  (14:02 UTC)
    # 11:00 AM Colombia (16:02 UTC)
    # 1:00 PM Colombia  (18:02 UTC)
    # 3:00 PM Colombia  (20:02 UTC)
    # 5:00 PM Colombia  (22:02 UTC)
    - cron: '2 14 * * 1-5'
    - cron: '2 16 * * 1-5'
    - cron: '2 18 * * 1-5'
    - cron: '2 20 * * 1-5'
    - cron: '2 22 * * 1-5'
  workflow_dispatch:

jobs:
  enviar-alerta-bihoraria:
    runs-on: ubuntu-latest
    steps:
      - name: Notificar a Google Chat
        env:
          TZ: 'America/Bogota'
        run: |
          node -e '
          const https = require("https");

          const GCHAT_WEBHOOK = "https://chat.googleapis.com/v1/spaces/AAQAW2t94sc/messages?key=AIzaSyDdI0hCZtE6vySjMm-WEfRq3CPzqKqqsHI&token=2GZ-2ChSl1mMEhgh7uxocoMdZt07sC-3qki7uPKIPNs";

          function request(url, options = {}, data = null) {
              return new Promise((resolve, reject) => {
                  const req = https.request(url, options, res => {
                      let body = "";
                      res.on("data", chunk => body += chunk);
                      res.on("end", () => resolve(body ? JSON.parse(body) : {}));
                  });
                  req.on("error", reject);
                  if (data) req.write(JSON.stringify(data));
                  req.end();
              });
          }

          async function main() {
              const now = new Date();
              const bogotaTimeStr = now.toLocaleString("en-US", { timeZone: "America/Bogota" });
              const bogotaDate = new Date(bogotaTimeStr);
              let hour = bogotaDate.getHours();
              const minutes = bogotaDate.getMinutes();

              // Si corre cerca de la siguiente hora (por ejemplo 10:55), redondear al bloque principal
              if (minutes >= 45) {
                  hour = (hour + 1) % 24;
              }

              // Normalizar a los bloques establecidos de la operacion
              let blockLabel = "";
              if (hour <= 9) blockLabel = "09:00 a. m.";
              else if (hour <= 11) blockLabel = "11:00 a. m.";
              else if (hour <= 13) blockLabel = "01:00 p. m.";
              else if (hour <= 15) blockLabel = "03:00 p. m.";
              else blockLabel = "05:00 p. m.";

              const msg = `🚨 *ALERTA BI-HORARIA DE RESULTADOS* (${blockLabel}) 🚨\n\n*Equipo de Operaciones*, ha llegado la hora de actualizar y publicar los resultados de EQ & FP en los chats correspondientes.`;

              await request(GCHAT_WEBHOOK, {
                  method: "POST",
                  headers: { "Content-Type": "application/json; charset=UTF-8" }
              }, { text: msg });

              console.log(`Alerta bi-horaria enviada para el bloque ${blockLabel}. Hora real de ejecucion: ${bogotaDate.toLocaleTimeString("es-CO")}`);
          }

          main().catch(console.error);
          '